name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest) + style (flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Style check
        run: python -m flake8
      - name: Unit + API tests (SQLite)
        run: python -m pytest -v

  backend-postgres:
    name: Backend tests on PostgreSQL (same database as the hosted demo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: churnsense
          POSTGRES_PASSWORD: churnsense
          POSTGRES_DB: churnsense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U churnsense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + API tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://churnsense:churnsense@localhost:5432/churnsense_test
        run: python -m pytest -q

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
