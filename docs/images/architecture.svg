<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1110" width="1120" height="1110" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">ChurnSense system architecture</title>
  <desc id="arch-desc">Analysts and retention managers use a React frontend that calls a FastAPI backend. For every customer the backend validates data, predicts churn with XGBoost, classifies risk, explains the score with SHAP, chooses a Next Best Action with what-if re-scoring, and tracks follow-up. Data is stored with SQLAlchemy; the model is trained offline; GitHub Actions checks every push.</desc>
  <style>
    svg {
      --bg:#ffffff; --border:#d0d7de; --text:#1f2328; --muted:#59636e;
      --card:#ffffff; --card-s:#d0d7de; --arrow:#6e7781; --pill:#ffffff;
      --fe:#eff6ff; --fe-s:#3b82f6; --fe-t:#1d4ed8;
      --be:#f5f3ff; --be-s:#8b5cf6; --be-t:#6d28d9;
      --da:#ecfdf5; --da-s:#10b981; --da-t:#047857;
      --ml:#fff7ed; --ml-s:#f97316; --ml-t:#c2410c;
      --ci:#f6f8fa; --ci-s:#8c959f; --ci-t:#57606a; --ok:#1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg:#0d1117; --border:#30363d; --text:#e6edf3; --muted:#9198a1;
        --card:#161b22; --card-s:#30363d; --arrow:#8b949e; --pill:#0d1117;
        --fe:#0c1d36; --fe-s:#3b82f6; --fe-t:#79b8ff;
        --be:#1b1433; --be-s:#8b5cf6; --be-t:#c4b5fd;
        --da:#062a1f; --da-s:#10b981; --da-t:#6ee7b7;
        --ml:#2b1608; --ml-s:#f97316; --ml-t:#fdba74;
        --ci:#161b22; --ci-s:#6e7681; --ci-t:#9198a1; --ok:#3fb950;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .bg { fill: var(--bg); stroke: var(--border); }
    .title { font-size: 24px; font-weight: 700; }
    .sub { font-size: 14px; fill: var(--muted); }
    .h { font-size: 14px; font-weight: 600; }
    .h13 { font-size: 13px; font-weight: 600; }
    .s { font-size: 12px; fill: var(--muted); }
    .xs { font-size: 11px; fill: var(--muted); }
    .label { font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px; }
    .card { fill: var(--card); stroke: var(--card-s); }
    .pill { fill: var(--pill); stroke: var(--card-s); }
    .fe { fill: var(--fe); stroke: var(--fe-s); stroke-width: 1.5; } .fe-t { fill: var(--fe-t); } .fe-f { fill: var(--fe-s); }
    .be { fill: var(--be); stroke: var(--be-s); stroke-width: 1.5; } .be-t { fill: var(--be-t); }
    .da { fill: var(--da); stroke: var(--da-s); stroke-width: 1.5; } .da-t { fill: var(--da-t); }
    .ml { fill: var(--ml); stroke: var(--ml-s); stroke-width: 1.5; } .ml-t { fill: var(--ml-t); }
    .ci { fill: var(--ci); stroke: var(--ci-s); stroke-width: 1.5; } .ci-t { fill: var(--ci-t); }
    .step { fill: var(--card); stroke: var(--be-s); stroke-opacity: 0.55; }
    .badge { fill: var(--be-s); }
    .badge-t { fill: #ffffff; font-size: 12px; font-weight: 700; }
    .flow { stroke: var(--arrow); stroke-width: 1.6; fill: none; }
    .off { stroke: var(--ml-s); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .ah { fill: var(--arrow); } .ah-off { fill: var(--ml-s); }
    .ok-pill { fill: var(--card); stroke: var(--ok); stroke-width: 1.5; } .ok-t { fill: var(--ok); font-weight: 700; } .ok-f { fill: var(--ok); }
    .low { fill: #16a34a; } .med { fill: #d97706; } .high { fill: #dc2626; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah-off"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="1119" height="1109" rx="18"/>

  <!-- ===== Title & legend ===== -->
  <text class="title" x="40" y="54">ChurnSense: System Architecture</text>
  <text class="sub" x="40" y="80">How a customer CSV becomes an explained, actionable retention decision</text>
  <line class="flow" x1="800" y1="46" x2="838" y2="46" marker-end="url(#a)"/>
  <text class="s" x="848" y="50">request / data flow</text>
  <line class="off" x1="800" y1="70" x2="838" y2="70" marker-end="url(#ao)"/>
  <text class="s" x="848" y="74">offline training output</text>

  <!-- ===== Users ===== -->
  <rect class="card" x="110" y="100" width="250" height="56" rx="28"/>
  <circle class="fe" cx="138" cy="128" r="17"/>
  <circle class="fe-f" cx="138" cy="122" r="5.5"/>
  <path class="fe-f" d="M129,138 a9,8 0 0 1 18,0 z"/>
  <text class="h" x="164" y="123">Analyst</text>
  <text class="s" x="164" y="142">uploads data · explores risk</text>

  <rect class="card" x="430" y="100" width="270" height="56" rx="28"/>
  <circle class="fe" cx="458" cy="128" r="17"/>
  <circle class="fe-f" cx="458" cy="122" r="5.5"/>
  <path class="fe-f" d="M449,138 a9,8 0 0 1 18,0 z"/>
  <text class="h" x="484" y="123">Retention Manager</text>
  <text class="s" x="484" y="142">acts on the Next Best Action</text>

  <line class="flow" x1="235" y1="157" x2="235" y2="188" marker-end="url(#a)"/>
  <line class="flow" x1="565" y1="157" x2="565" y2="188" marker-end="url(#a)"/>

  <!-- ===== Frontend ===== -->
  <rect class="fe" x="40" y="190" width="720" height="152" rx="14"/>
  <text class="label fe-t" x="60" y="216">FRONTEND</text>
  <text class="s" x="150" y="216">React 18 · TypeScript · Vite · Recharts  ·  hosted on Vercel</text>

  <rect class="card" x="60" y="230" width="161" height="96" rx="10"/>
  <text class="h" x="74" y="254">Dashboard</text>
  <text class="s" x="74" y="274">KPIs · risk mix</text>
  <text class="s" x="74" y="291">risk by contract</text>
  <text class="xs mono fe-t" x="74" y="313">US10</text>

  <rect class="card" x="233" y="230" width="161" height="96" rx="10"/>
  <text class="h" x="247" y="254">Customers</text>
  <text class="s" x="247" y="274">CSV upload + errors</text>
  <text class="s" x="247" y="291">search · filters</text>
  <text class="xs mono fe-t" x="247" y="313">US01 · US02</text>

  <rect class="card" x="406" y="230" width="161" height="96" rx="10"/>
  <text class="h" x="420" y="254">Customer detail</text>
  <text class="s" x="420" y="274">SHAP explanation</text>
  <text class="s" x="420" y="291">best action + plan</text>
  <text class="xs mono fe-t" x="420" y="313">US03-09 · US14</text>

  <rect class="card" x="579" y="230" width="161" height="96" rx="10"/>
  <text class="h" x="593" y="254">Model</text>
  <text class="s" x="593" y="274">holdout metrics</text>
  <text class="s" x="593" y="291">what-if predictor</text>
  <text class="xs mono fe-t" x="593" y="313">US04-06</text>

  <!-- FE <-> BE -->
  <line class="flow" x1="400" y1="345" x2="400" y2="377" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="pill" x="414" y="350" width="156" height="22" rx="11"/>
  <text class="xs mono" x="492" y="365" text-anchor="middle">HTTP · JSON · /api/*</text>

  <!-- ===== Backend ===== -->
  <rect class="be" x="40" y="380" width="720" height="496" rx="14"/>
  <text class="label be-t" x="60" y="406">BACKEND API</text>
  <text class="s" x="172" y="406">FastAPI · Python 3.11 · Pydantic  ·  hosted on Render</text>

  <rect class="card" x="60" y="420" width="300" height="72" rx="10"/>
  <text class="h13 mono be-t" x="74" y="443">/api/customers</text>
  <text class="s" x="74" y="463">upload · list · profile · explanation</text>
  <text class="s" x="74" y="480">recommendation · next-best-action · action</text>

  <rect class="card" x="370" y="420" width="210" height="72" rx="10"/>
  <text class="h13 mono be-t" x="384" y="443">/api/predict</text>
  <text class="s" x="384" y="463">what-if single prediction</text>
  <text class="h13 mono be-t" x="384" y="481">/api/model/metrics</text>

  <rect class="card" x="590" y="420" width="150" height="72" rx="10"/>
  <text class="h13 mono be-t" x="604" y="443">/api/dashboard</text>
  <text class="s" x="604" y="463">summary + filters</text>
  <text class="s" x="604" y="480">risk · follow-up</text>

  <text class="label" x="60" y="516" style="fill:var(--muted)">SERVICE PIPELINE · RUNS FOR EVERY CUSTOMER · backend/app/services</text>

  <!-- row 1 -->
  <rect class="step" x="60" y="528" width="212" height="92" rx="10"/>
  <circle class="badge" cx="82" cy="552" r="12"/><text class="badge-t" x="82" y="556.5" text-anchor="middle">1</text>
  <text class="h" x="102" y="557">Validate</text>
  <text class="xs mono be-t" x="258" y="557" text-anchor="end">US01</text>
  <text class="xs mono" x="102" y="574">validation.py</text>
  <text class="s" x="76" y="594">types, ranges, categories, IDs</text>
  <text class="s" x="76" y="611">errors name the row and column</text>

  <rect class="step" x="294" y="528" width="212" height="92" rx="10"/>
  <circle class="badge" cx="316" cy="552" r="12"/><text class="badge-t" x="316" y="556.5" text-anchor="middle">2</text>
  <text class="h" x="336" y="557">Predict</text>
  <text class="xs mono be-t" x="492" y="557" text-anchor="end">US04</text>
  <text class="xs mono" x="336" y="574">prediction.py</text>
  <text class="s" x="310" y="594">XGBoost scores every customer</text>
  <text class="s" x="310" y="611">churn probability from 0 to 1</text>

  <rect class="step" x="528" y="528" width="212" height="92" rx="10"/>
  <circle class="badge" cx="550" cy="552" r="12"/><text class="badge-t" x="550" y="556.5" text-anchor="middle">3</text>
  <text class="h" x="570" y="557">Classify risk</text>
  <text class="xs mono be-t" x="726" y="557" text-anchor="end">US05</text>
  <text class="xs mono" x="570" y="574">risk.py</text>
  <text class="s" x="544" y="594">thresholds at 40% and 70%</text>
  <circle class="low" cx="548" cy="607" r="4"/><text class="s" x="556" y="611">Low</text>
  <circle class="med" cx="590" cy="607" r="4"/><text class="s" x="598" y="611">Medium</text>
  <circle class="high" cx="652" cy="607" r="4"/><text class="s" x="660" y="611">High</text>

  <line class="flow" x1="273" y1="574" x2="292" y2="574" marker-end="url(#a)"/>
  <line class="flow" x1="507" y1="574" x2="526" y2="574" marker-end="url(#a)"/>
  <path class="flow" d="M634,621 V634 H166 V646" marker-end="url(#a)"/>

  <!-- row 2 -->
  <rect class="step" x="60" y="648" width="212" height="92" rx="10"/>
  <circle class="badge" cx="82" cy="672" r="12"/><text class="badge-t" x="82" y="676.5" text-anchor="middle">4</text>
  <text class="h" x="102" y="677">Explain</text>
  <text class="xs mono be-t" x="258" y="677" text-anchor="end">US07</text>
  <text class="xs mono" x="102" y="694">explain.py · SHAP</text>
  <text class="s" x="76" y="714">how much each field pushed</text>
  <text class="s" x="76" y="731">this customer's churn score</text>

  <rect class="step" x="294" y="648" width="212" height="92" rx="10"/>
  <circle class="badge" cx="316" cy="672" r="12"/><text class="badge-t" x="316" y="676.5" text-anchor="middle">5</text>
  <text class="h" x="336" y="677">Next Best Action</text>
  <text class="xs mono be-t" x="492" y="677" text-anchor="end">US14</text>
  <text class="xs mono" x="336" y="694">next_best_action.py</text>
  <text class="s" x="310" y="714">tries each action on a copy</text>
  <text class="s" x="310" y="731">re-scores → best action + plan</text>

  <rect class="step" x="528" y="648" width="212" height="92" rx="10"/>
  <circle class="badge" cx="550" cy="672" r="12"/><text class="badge-t" x="550" y="676.5" text-anchor="middle">6</text>
  <text class="h" x="570" y="677">Track follow-up</text>
  <text class="xs mono be-t" x="726" y="677" text-anchor="end">US09</text>
  <text class="xs mono" x="570" y="694">actions.py</text>
  <text class="s" x="544" y="714" style="font-size:11px">Pending → Contacted → Completed</text>
  <text class="s" x="544" y="731">saved; steps cannot be skipped</text>

  <line class="flow" x1="273" y1="694" x2="292" y2="694" marker-end="url(#a)"/>
  <line class="flow" x1="507" y1="694" x2="526" y2="694" marker-end="url(#a)"/>

  <!-- supporting modules -->
  <rect class="card" x="60" y="760" width="335" height="100" rx="10"/>
  <text class="h13" x="76" y="784">Shared foundations</text>
  <text class="s" x="76" y="804">fields.py: one definition of all 10 fields</text>
  <text class="s" x="76" y="822">features.py: same encoding to train and serve</text>
  <text class="s" x="76" y="840">/api/predict reuses the CSV validator</text>

  <rect class="card" x="405" y="760" width="335" height="100" rx="10"/>
  <text class="h13" x="421" y="784">Portfolio dashboard</text>
  <text class="s" x="421" y="804">dashboard.py: totals, risk mix, averages</text>
  <text class="s" x="421" y="822">risk by contract · follow-up pipeline</text>
  <text class="s" x="421" y="840">filters: contract type, internet service</text>

  <!-- BE <-> Data -->
  <line class="flow" x1="250" y1="879" x2="250" y2="913" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="pill" x="262" y="885" width="96" height="22" rx="11"/>
  <text class="xs mono" x="310" y="900" text-anchor="middle">read / write</text>
  <line class="flow" x1="607" y1="914" x2="607" y2="879" marker-end="url(#a)"/>
  <rect class="pill" x="619" y="885" width="96" height="22" rx="11"/>
  <text class="xs mono" x="667" y="900" text-anchor="middle">load model</text>

  <!-- ===== Data ===== -->
  <rect class="da" x="40" y="916" width="720" height="138" rx="14"/>
  <text class="label da-t" x="60" y="942">DATA</text>
  <text class="s" x="110" y="942">SQLAlchemy 2 ORM · model files</text>

  <rect class="card" x="60" y="954" width="400" height="86" rx="10"/>
  <path class="da" d="M76,971 V1005 a15,5 0 0 0 30,0 V971"/>
  <ellipse class="da" cx="91" cy="971" rx="15" ry="5"/>
  <path class="da" d="M76,988 a15,5 0 0 0 30,0" fill="none"/>
  <text class="h" x="120" y="976">Database</text>
  <text class="s" x="120" y="995">customers: 10 fields + probability + risk</text>
  <text class="s" x="120" y="1012">retention_actions: rule · action · status</text>
  <text class="xs da-t" x="120" y="1029">PostgreSQL on Render · SQLite locally</text>

  <rect class="card" x="475" y="954" width="265" height="86" rx="10"/>
  <path class="da" d="M491,966 h17 l8,8 v28 h-25 z"/>
  <path class="da" d="M508,966 v8 h8" fill="none"/>
  <text class="h" x="530" y="976">Model artifacts</text>
  <text class="s mono" x="530" y="995">churn_model.json</text>
  <text class="s mono" x="530" y="1012">metrics.json</text>
  <text class="xs da-t" x="530" y="1029">loaded once, then cached</text>

  <!-- ===== Offline ML pipeline ===== -->
  <rect class="ml" x="790" y="190" width="290" height="500" rx="14"/>
  <text class="label ml-t" x="808" y="216">OFFLINE ML PIPELINE</text>
  <text class="s" x="808" y="234">run once: python -m ml.train</text>

  <rect class="card" x="808" y="250" width="254" height="74" rx="10"/>
  <text class="h13 mono ml-t" x="822" y="272">generate_data.py</text>
  <text class="s" x="822" y="292">synthetic telecom customers</text>
  <text class="s" x="822" y="309">fixed seed 42 · about 30% churn</text>
  <line class="flow" x1="935" y1="325" x2="935" y2="346" marker-end="url(#a)"/>

  <rect class="card" x="808" y="348" width="254" height="74" rx="10"/>
  <text class="h13 mono ml-t" x="822" y="370">training_customers.csv</text>
  <text class="s" x="822" y="390">3,000 labelled customers</text>
  <text class="s" x="822" y="407">validated like any upload</text>
  <line class="flow" x1="935" y1="423" x2="935" y2="444" marker-end="url(#a)"/>

  <rect class="card" x="808" y="446" width="254" height="92" rx="10"/>
  <text class="h13 mono ml-t" x="822" y="468">train.py</text>
  <text class="s" x="822" y="488">stratified 80 / 20 split</text>
  <text class="s" x="822" y="505">XGBoost · 300 trees · depth 3</text>
  <text class="s" x="822" y="522">+ global SHAP importance</text>
  <line class="flow" x1="935" y1="539" x2="935" y2="560" marker-end="url(#a)"/>

  <rect class="card" x="808" y="562" width="254" height="104" rx="10"/>
  <text class="h13 ml-t" x="822" y="584">Honest evaluation</text>
  <text class="s" x="822" y="604">600 unseen (holdout) customers</text>
  <text class="s" x="822" y="621">ROC-AUC 0.83 · accuracy 0.76</text>
  <text class="s" x="822" y="638">training scores shown separately</text>
  <text class="xs ml-t" x="822" y="656">saves model + metrics.json</text>

  <path class="off" d="M790,640 H780 V997 H743" marker-end="url(#ao)"/>
  <text class="xs ml-t" transform="translate(774 818) rotate(-90)" text-anchor="middle" style="font-size:10px">trained model files</text>

  <!-- ===== Quality & delivery ===== -->
  <rect class="ci" x="790" y="714" width="290" height="340" rx="14"/>
  <text class="label ci-t" x="808" y="740">QUALITY &amp; DELIVERY</text>
  <text class="s" x="808" y="758">GitHub Actions on every push &amp; PR</text>

  <rect class="card" x="808" y="772" width="254" height="36" rx="18"/>
  <text class="s mono" x="935" y="795" text-anchor="middle" style="fill:var(--text)">git push / pull request</text>
  <line class="flow" x1="935" y1="809" x2="935" y2="820" marker-end="url(#a)"/>
  <rect class="card" x="808" y="822" width="254" height="36" rx="18"/>
  <text class="s" x="935" y="845" text-anchor="middle" style="fill:var(--text)">flake8 · style rules</text>
  <line class="flow" x1="935" y1="859" x2="935" y2="870" marker-end="url(#a)"/>
  <rect class="card" x="808" y="872" width="254" height="36" rx="18"/>
  <text class="s" x="935" y="895" text-anchor="middle" style="fill:var(--text)">pytest · 142 tests · SQLite + Postgres</text>
  <line class="flow" x1="935" y1="909" x2="935" y2="920" marker-end="url(#a)"/>
  <rect class="card" x="808" y="922" width="254" height="36" rx="18"/>
  <text class="s" x="935" y="945" text-anchor="middle" style="fill:var(--text)">tsc + vite build · frontend</text>
  <line class="flow" x1="935" y1="959" x2="935" y2="970" marker-end="url(#a)"/>
  <rect class="ok-pill" x="808" y="972" width="254" height="36" rx="18"/>
  <circle class="ok-f" cx="862" cy="990" r="8"/>
  <path d="M858,990 l3,3 l5,-6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="s ok-t" x="878" y="995">All green → Render deploys</text>
  <text class="xs" x="935" y="1034" text-anchor="middle">a failing check blocks the deploy</text>

  <!-- ===== Footer ===== -->
  <text class="s" x="560" y="1088" text-anchor="middle">Scrum + Kanban · 4 sprints · tests written first (TDD) · CI on every push · Agile docs in docs/agile/</text>
</svg>
